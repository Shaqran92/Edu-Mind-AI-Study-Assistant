[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edumind"
version = "1.0.0"
description = "EduMind - AI-Powered Study Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CodeCrafters Team"}
]
keywords = ["education", "ai", "study", "learning", "flashcards", "quiz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "PyQt6>=6.5.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "openai>=1.10.0",
    "google-generativeai>=0.3.0",
    "pyttsx3>=2.90",
    "langdetect>=1.0.9",
    "reportlab>=4.0.0",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python>=4.9.0",
    "Pillow>=10.2.0",
]

[project.scripts]
edumind = "app:main"

[project.urls]
Homepage = "https://github.com/YourGitHubUsername/EduMind"
Documentation = "https://github.com/YourGitHubUsername/EduMind#readme"
Repository = "https://github.com/YourGitHubUsername/EduMind.git"
Issues = "https://github.com/YourGitHubUsername/EduMind/issues"

[tool.setuptools]
packages = ["core", "ui", "data", "utils"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.ico", "*.svg"]

# ===== Tool Configuration =====

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["core", "utils"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "ui", "data", "utils"]
